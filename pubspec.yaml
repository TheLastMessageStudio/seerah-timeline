name: seerah_timeline
description: Chronologie interactive de la Sîrah.
publish_to: none
version: 0.9.6+17

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  url_launcher: ^6.3.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  app_links: ^6.3.2
  uuid: ^4.5.1
  pdfrx: 1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/data/hadith/
    - assets/data/i18n/fr/
    - assets/data/i18n/en/
    - assets/data/i18n/ar/
    - assets/images/
    - assets/images/generated/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B5D3B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
